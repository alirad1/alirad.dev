[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The AliBot write-up moved to its README.
[[redirects]]
  from = "/alibot"
  to = "https://github.com/alirad1/alirad.dev/blob/master/alibot/README.md"
  status = 302
  force = true

# Pages from the old multi-page site.
[[redirects]]
  from = "/projects.html"
  to = "/#projects"
  status = 301

[[redirects]]
  from = "/experiences.html"
  to = "/#experience"
  status = 301

[[redirects]]
  from = "/moments.html"
  to = "/#moments"
  status = 301
